<section class="publications-section wrap" id="publications" data-publication-explorer>
  <div class="section-heading"><div><h2>Selected publications</h2></div><a class="text-link" href="{{ site.author.googlescholar }}">Google Scholar <i data-lucide="arrow-up-right" aria-hidden="true"></i></a></div>
  <div class="publication-filters" role="group" aria-label="Filter publications">
    <button type="button" data-filter="all" aria-pressed="true">All research</button>
    <button type="button" data-filter="retrieval" aria-pressed="false">Information retrieval</button>
    <button type="button" data-filter="hci" aria-pressed="false">HCI &amp; workload</button>
  </div>
  <div class="publication-grid">
    <div class="paper-list">
      {% for paper in site.data.research_publications %}
      <div class="paper-entry">
        <button type="button" class="paper-select" data-paper="{{ forloop.index0 }}" aria-pressed="false" aria-controls="paper-detail">
          <span class="paper-meta"><span class="venue-tag venue-{{ paper.venue | downcase }}">{{ paper.venue }}</span><span>{{ paper.year }}</span>{% if paper.pdf %}<span class="pdf-label">PDF</span>{% endif %}</span>
          <span class="paper-title">{{ paper.title | escape }}</span>
          <span class="paper-venue">{{ paper.venue_full }}</span>
          <i data-lucide="arrow-up-right" aria-hidden="true"></i>
        </button>
        <noscript>{% if paper.pdf %}<a href="{{ paper.pdf | relative_url }}">Read PDF</a>{% elsif paper.publisher %}<a href="{{ paper.publisher }}">Publisher record</a>{% else %}<a href="{{ site.author.googlescholar }}">Google Scholar</a>{% endif %}</noscript>
      </div>
      {% endfor %}
    </div>
    <div class="paper-detail" id="paper-detail">
      <div class="reader-heading"><span class="eyebrow">Paper reader</span><div class="reader-cycle"><button type="button" class="icon-button" data-cycle="-1" aria-label="Previous publication" title="Previous publication"><i data-lucide="arrow-left" aria-hidden="true"></i></button><button type="button" class="icon-button" data-cycle="1" aria-label="Next publication" title="Next publication"><i data-lucide="arrow-right" aria-hidden="true"></i></button></div></div>
      <div class="selected-paper" aria-live="polite" aria-atomic="true"><p class="eyebrow" id="selected-venue">Selected publication</p><h3 id="selected-title">Research publications</h3><p class="selected-authors" id="selected-authors"></p><p id="selected-summary">Publication records and available manuscripts.</p></div>
      <div class="pdf-toolbar"><div class="pdf-pagination"><button type="button" class="icon-button" id="previous-page" aria-label="Previous PDF page" title="Previous PDF page" disabled><i data-lucide="chevron-left" aria-hidden="true"></i></button><span id="pdf-page" aria-label="PDF page">-- / --</span><button type="button" class="icon-button" id="next-page" aria-label="Next PDF page" title="Next PDF page" disabled><i data-lucide="chevron-right" aria-hidden="true"></i></button></div><a class="text-link" id="paper-link" target="_blank" rel="noopener" hidden>Open PDF <i data-lucide="external-link" aria-hidden="true"></i></a><a class="text-link" id="publisher-link" target="_blank" rel="noopener" hidden>Publisher <i data-lucide="external-link" aria-hidden="true"></i></a></div>
      <div class="pdf-preview"><p id="pdf-message" role="status">Select a publication to view its manuscript.</p><canvas id="pdf-canvas" role="img" aria-label="Selected publication PDF page preview" hidden></canvas></div>
      <noscript><p>PDF links are listed beside each publication.</p></noscript>
    </div>
  </div>
</section>
<script id="publication-data" type="application/json">[
{% for paper in site.data.research_publications %}
{"id":{{ paper.id | jsonify }},"title":{{ paper.title | jsonify }},"venue":{{ paper.venue | jsonify }},"year":{{ paper.year | jsonify }},"authors":{{ paper.authors | jsonify }},"topic":{{ paper.topic | jsonify }},"summary":{{ paper.summary | jsonify }},"publisher":{{ paper.publisher | default: '' | jsonify }},"pdf":{% if paper.pdf %}{{ paper.pdf | relative_url | jsonify }}{% else %}""{% endif %}}{% unless forloop.last %},{% endunless %}
{% endfor %}
]</script>
