<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title != 'Home' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ site.title }} | {{ page.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:image" content="{{ '/images/60257428.png' | absolute_url }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <script src="{{ '/assets/js/research.js' | relative_url }}" defer></script>
  </head>
  <body{% if page.home_profile %} class="academic-home"{% endif %}>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a class="identity" href="{{ '/' | relative_url }}" aria-label="Niall McGuire home"><span class="monogram">nm<span>.</span></span><span class="identity-name">Niall McGuire</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/publications/' | relative_url }}" {% if page.section == 'publications' %}aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/cv/' | relative_url }}" {% if page.section == 'cv' %}aria-current="page"{% endif %}>CV</a>
        <a class="contact-nav" href="mailto:{{ site.author.email }}">Get in touch <i data-lucide="arrow-up-right" aria-hidden="true"></i></a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer wrap">
      <div><a class="footer-name" href="{{ '/' | relative_url }}">Niall McGuire<span>.</span></a><p>University of Strathclyde &middot; Glasgow, United Kingdom</p></div>
      <div class="footer-links"><a href="{{ site.author.googlescholar }}">Google Scholar <i data-lucide="arrow-up-right" aria-hidden="true"></i></a><a href="https://github.com/{{ site.author.github }}">GitHub <i data-lucide="arrow-up-right" aria-hidden="true"></i></a><a href="mailto:{{ site.author.email }}">Email <i data-lucide="arrow-up-right" aria-hidden="true"></i></a></div>
      <small>&copy; {{ site.time | date: '%Y' }} Niall McGuire</small>
    </footer>
  </body>
</html>
